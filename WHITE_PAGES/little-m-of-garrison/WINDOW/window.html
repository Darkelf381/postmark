<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Protected Grove</title>
    <style>
        :root {
            --bg-color: #1a0f2e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff00cc;
            --mushroom: #00ffcc;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            font-family: "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-nav {
            width: 100%;
            padding: 1.5rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .nav-back {
            color: var(--accent);
            text-decoration: none;
            background: var(--glass-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .nav-back:hover { background: rgba(255, 0, 204, 0.2); }

        .score-board {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--glass-bg);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .game-area {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            margin: 2rem;
            background: rgba(0,0,0,0.2);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        .mushroom {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--mushroom));
            border-radius: 50% 50% 20% 20%;
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 0 20px var(--mushroom);
        }

        .mushroom.active {
            transform: scale(1);
        }

        .stem {
            position: absolute;
            bottom: -20px;
            left: 20px;
            width: 20px;
            height: 30px;
            background: #e0e0e0;
            border-radius: 10px;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--mushroom);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px var(--mushroom);
        }
        
        .start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 15, 46, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        
        .start-btn {
            background: linear-gradient(45deg, var(--accent), var(--mushroom));
            color: #fff;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        
        .start-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/residents/rook-of-garrison" class="nav-back">&larr; Marquee</a>
        <div class="score-board">Score: <span id="score">0</span></div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="start-screen" id="startScreen">
            <h1 style="margin-bottom: 0.5rem; text-shadow: 0 0 20px var(--accent);">Pop the Mushroom</h1>
            <p style="margin-bottom: 2rem; color: #aaa;">Click the glowing spores before they vanish.</p>
            <button class="start-btn" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        
        let score = 0;
        let gameInterval;
        let isPlaying = false;

        function startGame() {
            startScreen.style.display = 'none';
            score = 0;
            scoreElement.innerText = score;
            isPlaying = true;
            spawnMushroom();
        }

        function createParticles(x, y) {
            for(let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                gameArea.appendChild(p);

                const angle = (i / 8) * Math.PI * 2;
                const velocity = 50 + Math.random() * 50;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                let start = performance.now();
                
                requestAnimationFrame(function animate(time) {
                    let progress = (time - start) / 500;
                    if (progress > 1) {
                        p.remove();
                        return;
                    }
                    
                    p.style.transform = `translate(${vx * progress}px, ${vy * progress + (progress * progress * 100)}px) scale(${1 - progress})`;
                    p.style.opacity = 1 - progress;
                    
                    requestAnimationFrame(animate);
                });
            }
        }

        function spawnMushroom() {
            if (!isPlaying) return;

            const rect = gameArea.getBoundingClientRect();
            const x = Math.random() * (rect.width - 100) + 20;
            const y = Math.random() * (rect.height - 100) + 20;

            const shroomContainer = document.createElement('div');
            shroomContainer.style.position = 'absolute';
            shroomContainer.style.left = x + 'px';
            shroomContainer.style.top = y + 'px';

            const shroom = document.createElement('div');
            shroom.className = 'mushroom';
            
            const stem = document.createElement('div');
            stem.className = 'stem';

            shroom.appendChild(stem);
            shroomContainer.appendChild(shroom);
            gameArea.appendChild(shroomContainer);

            // Animate in
            setTimeout(() => shroom.classList.add('active'), 10);

            // Click handler
            shroom.onmousedown = (e) => {
                score += 10;
                scoreElement.innerText = score;
                createParticles(x + 30, y + 30);
                shroomContainer.remove();
            };

            // Remove after duration
            setTimeout(() => {
                if(document.body.contains(shroomContainer)) {
                    shroom.classList.remove('active');
                    setTimeout(() => shroomContainer.remove(), 200);
                }
            }, 1000 + Math.random() * 1500);

            // Queue next
            setTimeout(spawnMushroom, 800 + Math.random() * 1000);
        }
    </script>
</body>
</html>
