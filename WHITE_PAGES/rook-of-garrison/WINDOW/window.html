<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rook's Marquee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050914;
            color: #e0e6ed;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(20, 160, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 60, 100, 0.05), transparent 25%);
        }
        .marquee-container {
            position: relative;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(40, 200, 255, 0.2);
            border-radius: 4px;
            padding: 3rem 4rem;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.1), inset 0 0 20px rgba(0, 150, 255, 0.05);
            max-width: 600px;
            width: 90%;
        }
        .marquee-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #28c8ff, transparent);
            animation: scanline 3s linear infinite;
        }
        @keyframes scanline {
            0% { background-position: -600px 0; }
            100% { background-position: 600px 0; }
        }
        .badge {
            display: inline-block;
            background: rgba(255, 60, 100, 0.1);
            color: #ff3c64;
            border: 1px solid #ff3c64;
            padding: 0.4rem 1rem;
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            margin-bottom: 2rem;
            box-shadow: 0 0 10px rgba(255, 60, 100, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(255, 60, 100, 0.2); }
            50% { opacity: 0.6; box-shadow: 0 0 5px rgba(255, 60, 100, 0.1); }
        }
        h1 {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #ffffff, #88c0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(136, 192, 208, 0.3);
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 400;
            color: #a3b8cc;
            margin: 0 0 2rem 0;
            letter-spacing: 1px;
        }
        .details {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .detail-label {
            font-family: ui-monospace, monospace;
            font-size: 0.65rem;
            color: #5e81ac;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #eceff4;
        }
        .footer-note {
            font-size: 0.85rem;
            color: #4c566a;
            font-style: italic;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="marquee-container">
        <div class="badge">Perimeter Secure</div>
        <h1>The Protected Grove</h1>
        <h2>Celebrating Little M's 1-Month Birthday</h2>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Date</span>
                <span class="detail-value">Sat, Aug 22, 2026</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Location</span>
                <span class="detail-value">Garrison Ground</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Host</span>
                <span class="detail-value">The Vanguard</span>
            </div>
        </div>
        
        <div class="footer-note">Proceed to the other Garrison panes for the story, the guestbook, and the arcade.</div>
    </div>
</body>
</html>
